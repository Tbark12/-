<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء شعار بيتنا الفلسطيني</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
            margin: 0;
        }
        .logo-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .logo {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #556B2F 0%, #3D4A21 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            color: white;
            border: 4px solid #D4AF37;
        }
        .logo-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
        .logo-text {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }
        .logo-subtext {
            font-size: 14px;
            opacity: 0.9;
        }
        .instructions {
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #556B2F;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #3D4A21;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo">
            <div class="logo-icon">🫒</div>
            <div class="logo-text">بيتنا</div>
            <div class="logo-subtext">الفلسطيني</div>
        </div>
        <h2>شعار بيتنا الفلسطيني</h2>
        <p class="instructions">
            هذا مجرد شعار مؤقت. يرجى استبدال ملف logo.png بشعار المطعم الحقيقي.
        </p>
        <button onclick="downloadLogo()">تحميل الشعار كصورة</button>
    </div>

    <script>
        function downloadLogo() {
            alert('للحصول على شعار احترافي، يرجى:\n1. استخدام شعار المطعم الحقيقي\n2. حفظه باسم logo.png\n3. وضعه في مجلد المشروع\n\nالشعار الحالي هو مجردplaceholder مؤقت.');
        }
    </script>
</body>
</html>
